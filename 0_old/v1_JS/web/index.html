<!--
  web/index.html — Owner: Alexandre.

  Main page of the TAP web GUI client.
  Served by cmd/gui over HTTP and communicates with the TAP server
  via the WebSocket bridge also provided by cmd/gui.

  Required UI sections (from spec):
    - Room panel: name, description, exits, items, NPCs
    - Players panel: who is in the current room + total server count
    - Action buttons: MOVE directions, TAKE/DROP items, TALK/ATTACK NPCs
    - Chat panel: tabs for GLOBAL / ROOM / GROUP messages
    - Inventory panel: list of held items with DROP button
    - Status bar: player HP and quest progress
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Answer Protocol</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header id="status-bar">
    <!-- TODO: player name, HP, current room, total players online -->
  </header>

  <main id="layout">

    <section id="room-panel">
      <h2 id="room-name">Room Name</h2>
      <p id="room-description">Description…</p>
      <div id="exits"><!-- TODO: exit buttons --></div>
      <div id="room-items"><!-- TODO: items on the floor --></div>
      <div id="room-npcs"><!-- TODO: NPCs present --></div>
      <div id="room-players"><!-- TODO: other players present --></div>
    </section>

    <section id="chat-panel">
      <!-- TODO: tab buttons for GLOBAL / ROOM / GROUP -->
      <div id="chat-log"></div>
      <input id="chat-input" type="text" placeholder="Type a message…" />
      <button id="chat-send">Send</button>
    </section>

    <section id="inventory-panel">
      <h2>Inventory</h2>
      <ul id="inventory-list"><!-- TODO: items + DROP buttons --></ul>
    </section>

    <section id="quest-panel">
      <h2>Quests</h2>
      <ul id="quest-list"><!-- TODO: active and completed quests --></ul>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
